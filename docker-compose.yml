# Local development only. Production uses the host's MySQL/MariaDB database (cPanel).
services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: kaziug
      MYSQL_USER: kaziug
      MYSQL_PASSWORD: kaziug
      MYSQL_ROOT_PASSWORD: kaziug-root
    ports:
      - "${DB_PORT:-3316}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ukaziug", "-pkaziug"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email sent locally. SMTP host 127.0.0.1, port 1025, encryption "none";
  # read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
    name: kaziug-mysql-data
