# Local development database only. Production uses Laravel Cloud's managed Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaziug
      POSTGRES_USER: kaziug
      POSTGRES_PASSWORD: kaziug
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaziug -d kaziug"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email sent locally. SMTP host 127.0.0.1, port 1025, encryption "none";
  # read the mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
