# Local development database only. Production uses Laravel Cloud's managed Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaziug
      POSTGRES_USER: kaziug
      POSTGRES_PASSWORD: kaziug
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaziug -d kaziug"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
